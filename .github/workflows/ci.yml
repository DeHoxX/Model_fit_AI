name: CI

on:
  push:
    branches: [main, phase-1-foundation, phase-2-estimator, phase-3-catalog, phase-4-chat, phase-5-persistence]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelfit
          POSTGRES_PASSWORD: modelfit_test_password
          POSTGRES_DB: modelfit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.8"

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync

      - name: Lint with ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Format check with ruff
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Typecheck with mypy
        working-directory: apps/api
        run: uv run mypy --strict src/modelfit

      - name: Architecture contract check
        working-directory: apps/api
        run: uv run lint-imports

      - name: Run migrations check (upgrade, downgrade, upgrade)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://modelfit:modelfit_test_password@localhost:5432/modelfit_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run pytest
        working-directory: apps/api
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://modelfit:modelfit_test_password@localhost:5432/modelfit_test
          TEST_DATABASE_URL: postgresql+asyncpg://modelfit:modelfit_test_password@localhost:5432/modelfit_test
          CORS_ORIGINS: http://localhost:3000
        run: uv run pytest --cov=src/modelfit --cov-report=term-missing --cov-fail-under=80 -v

  web:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Unit and Integration Tests
        working-directory: apps/web
        run: npm run test

      - name: Production Build
        working-directory: apps/web
        run: npm run build
